<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spam Classifier</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 720px; /* wider to fit bigger box */
            max-width: calc(100% - 40px);
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.6);
            text-align: center;
        }

        h2 {
            margin-bottom: 18px;
            color: #10E6F6;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        /* Large textarea for message input */
        textarea[name="message"] {
            flex: 1;
            min-height: 140px;    /* larger box height */
            max-height: 400px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #222;
            color: white;
            font-size: 16px;
            line-height: 1.4;
            resize: vertical;     /* allow vertical resize; use "none" to prevent */
        }

        /* Submit button */
        button {
            padding: 12px 18px;
            background: #10E6F6;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            height: 48px;         /* keep consistent with textarea */
            align-self: flex-start;
        }

        /* Result styling */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #222;
            border-radius: 10px;
            text-align: left;
        }

        .result-label {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 10px;
        }

        .result-content {
            background: #333;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            white-space: pre-wrap; /* preserve newlines/formatting */
        }

        .prediction-badge {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 12px;
        }

        .prediction-badge.ham {
            background: #0f0;
            color: #000;
        }

        .prediction-badge.spam {
            background: #ff4d4d;
            color: #000;
        }

        .icon {
            font-size: 22px;
            margin-right: 8px;
        }

        /* Responsive tweaks */
        @media (max-width: 600px) {
            .container { width: calc(100% - 24px); padding: 18px; }
            textarea[name="message"] { min-height: 110px; }
            button { height: 44px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🛡️ Spam Message Classifier</h2>

        <form action="/predict" method="POST">
            <div class="input-group">
                <!-- replaced single-line input with a textarea for large messages -->
                <textarea name="message" placeholder="Enter your message to check... (paste long messages here)" required></textarea>
                <button type="submit">Analyze</button>
            </div>
        </form>

        {% if prediction %}
        <div class="result-box">
            <div class="result-label">Your Message</div>
            <div class="result-content">{{message}}</div>

            <div class="result-label">Classification Result</div>
            <span class="prediction-badge {% if prediction.lower() == 'spam 🚨' or 'spam' in prediction.lower() %}spam{% else %}ham{% endif %}">
                <span class="icon">{% if 'spam' in prediction.lower() %}⚠️{% else %}✅{% endif %}</span>
                {{prediction}}
            </span>
        </div>
        {% endif %}
    </div>
</body>
</html>
